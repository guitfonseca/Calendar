<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@300;400;500&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0f0f0f;
  --bg2:      #161616;
  --bg3:      #1e1e1e;
  --bg4:      #252525;
  --border:   #2a2a2a;
  --border2:  #333333;
  --text:     #e8e8e8;
  --text2:    #a0a0a0;
  --text3:    #606060;
  --accent:   #d4a843;
  --accent2:  #b8922e;
  --red:      #e05555;
  --green:    #55b87a;
  --blue:     #5588e0;
  --purple:   #9955e0;
  --pink:     #e055aa;

  --nb-usp:      #5588e0;
  --nb-idiomas:  #55b87a;
  --nb-trabalho: #d4a843;
  --nb-math:     #9955e0;
  --nb-pessoal:  #e055aa;
  --nb-misc:     #a0a0a0;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Geist',sans-serif; font-size:14px; overflow:hidden; }

/* ── LAYOUT ── */
.app { display:flex; height:100vh; }

/* ── SIDEBAR ── */
.sidebar {
  width: 240px;
  flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width .25s ease;
}
.sidebar.collapsed { width: 0; }

.sb-top {
  padding: 20px 16px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sb-brand {
  font-family: 'Instrument Serif', serif;
  font-size: 22px;
  color: var(--text);
  letter-spacing: -.01em;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sb-brand span { color: var(--accent); }

.search-wrap { position: relative; }
.search-inp {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 7px;
  color: var(--text);
  font-family: 'Geist Mono', monospace;
  font-size: 11px;
  padding: 7px 10px 7px 30px;
  outline: none;
  transition: border-color .15s;
}
.search-inp:focus { border-color: var(--accent); }
.search-inp::placeholder { color: var(--text3); }
.search-icon { position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--text3); font-size:12px; pointer-events:none; }

/* Notebooks section */
.sb-section { padding: 14px 16px 6px; flex-shrink: 0; }
.sb-section-lbl {
  font-family: 'Geist Mono', monospace;
  font-size: 9px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 8px;
}
.nb-list { display:flex; flex-direction:column; gap:1px; }
.nb-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: 6px;
  cursor: pointer;
  transition: background .12s;
  position: relative;
}
.nb-item:hover { background: var(--bg3); }
.nb-item.active { background: var(--bg4); }
.nb-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.nb-name { font-size:13px; color:var(--text2); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nb-item.active .nb-name { color:var(--text); }
.nb-count { font-family:'Geist Mono',monospace; font-size:9px; color:var(--text3); background:var(--bg); padding:1px 5px; border-radius:3px; }
.nb-add {
  display:flex; align-items:center; gap:8px;
  padding:7px 8px; border-radius:6px; cursor:pointer;
  color:var(--text3); font-size:12px; margin-top:4px;
  transition:color .12s;
}
.nb-add:hover { color:var(--accent); }

/* Notes list */
.sb-notes { flex:1; overflow-y:auto; padding:6px 8px 12px; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
.note-item {
  padding: 10px 10px;
  border-radius: 7px;
  cursor: pointer;
  margin-bottom: 2px;
  border: 1px solid transparent;
  transition: all .12s;
}
.note-item:hover { background:var(--bg3); }
.note-item.active { background:var(--bg3); border-color:var(--border2); }
.ni-title { font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:3px; font-weight:500; }
.ni-meta { display:flex; align-items:center; gap:6px; }
.ni-date { font-family:'Geist Mono',monospace; font-size:9px; color:var(--text3); }
.ni-tag { font-family:'Geist Mono',monospace; font-size:8px; padding:1px 5px; border-radius:3px; }
.ni-preview { font-size:11px; color:var(--text3); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.empty-notes { text-align:center; padding:32px 12px; color:var(--text3); font-size:12px; line-height:1.7; }

/* ── MIDDLE PANEL (notes list on mobile, hidden on desktop when editor open) ── */

/* ── EDITOR ── */
.editor-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

/* Toolbar */
.toolbar {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  flex-wrap: wrap;
  flex-shrink: 0;
}
.tb-group { display:flex; align-items:center; gap:1px; }
.tb-sep { width:1px; height:18px; background:var(--border2); margin:0 6px; }
.tbtn {
  background:transparent; border:none; color:var(--text2);
  width:28px; height:28px; border-radius:5px;
  font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all .12s; font-family:'Geist',sans-serif;
}
.tbtn:hover { background:var(--bg3); color:var(--text); }
.tbtn.active { background:var(--bg4); color:var(--accent); }
.tbtn-wide { width:auto; padding:0 10px; font-size:11px; font-family:'Geist Mono',monospace; letter-spacing:.05em; }

/* Sidebar toggle */
.sb-toggle {
  background:transparent; border:none; color:var(--text3);
  width:28px; height:28px; border-radius:5px;
  font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all .12s; margin-right:6px;
}
.sb-toggle:hover { color:var(--text); background:var(--bg3); }

/* Editor header */
.ed-header { padding:28px 40px 0; flex-shrink:0; }
.ed-notebook-badge {
  display:inline-flex; align-items:center; gap:6px;
  font-family:'Geist Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--text3); margin-bottom:14px; cursor:pointer; padding:4px 0;
}
.ed-notebook-badge:hover { color:var(--text2); }
.ed-nb-dot { width:7px; height:7px; border-radius:50%; }
.ed-title-inp {
  width:100%; background:transparent; border:none; outline:none;
  font-family:'Instrument Serif',serif; font-size:clamp(24px,3vw,36px);
  color:var(--text); line-height:1.2; resize:none; overflow:hidden;
  caret-color:var(--accent);
}
.ed-title-inp::placeholder { color:var(--text3); }

/* Tag row */
.ed-tags { display:flex; align-items:center; flex-wrap:wrap; gap:6px; padding:12px 40px 0; flex-shrink:0; }
.tag-chip {
  font-family:'Geist Mono',monospace; font-size:10px; padding:3px 9px;
  border-radius:12px; border:1px solid var(--border2); color:var(--text3);
  cursor:pointer; display:flex; align-items:center; gap:4px; transition:all .12s;
}
.tag-chip:hover { border-color:var(--accent); color:var(--accent); }
.tag-chip .tx { margin-left:1px; font-size:12px; line-height:1; opacity:.5; }
.tag-chip .tx:hover { opacity:1; color:var(--red); }
.tag-add {
  font-family:'Geist Mono',monospace; font-size:10px; padding:3px 9px;
  border-radius:12px; border:1px dashed var(--border2); color:var(--text3);
  cursor:pointer; background:transparent; outline:none; width:80px;
  transition:all .12s;
}
.tag-add:focus { border-color:var(--accent); color:var(--text); width:120px; }

/* Meta line */
.ed-meta { padding:6px 40px 12px; display:flex; align-items:center; gap:14px; border-bottom:1px solid var(--border); flex-shrink:0; }
.ed-meta-item { font-family:'Geist Mono',monospace; font-size:10px; color:var(--text3); display:flex; align-items:center; gap:4px; }

/* Content area */
.ed-content {
  flex:1; overflow-y:auto; padding:24px 40px 80px;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
}
.editor {
  min-height:100%;
  outline:none;
  font-size:15px;
  line-height:1.75;
  color:var(--text2);
  caret-color:var(--accent);
  max-width:720px;
}
.editor:empty::before { content:attr(data-placeholder); color:var(--text3); pointer-events:none; font-style:italic; }

/* Rich text styles inside editor */
.editor h1 { font-family:'Instrument Serif',serif; font-size:26px; color:var(--text); margin:20px 0 8px; line-height:1.3; }
.editor h2 { font-family:'Instrument Serif',serif; font-size:20px; color:var(--text); margin:18px 0 6px; }
.editor h3 { font-family:'Geist',sans-serif; font-size:15px; font-weight:500; color:var(--text); margin:14px 0 4px; text-transform:uppercase; letter-spacing:.06em; font-size:12px; }
.editor p { margin-bottom:6px; }
.editor strong { color:var(--text); font-weight:600; }
.editor em { color:var(--accent); font-style:italic; }
.editor u { text-decoration-color:var(--accent); }
.editor ul, .editor ol { padding-left:22px; margin:6px 0 10px; }
.editor li { margin-bottom:3px; }
.editor blockquote {
  border-left:3px solid var(--accent);
  padding:8px 16px;
  margin:12px 0;
  background:var(--bg2);
  border-radius:0 6px 6px 0;
  color:var(--text2);
  font-style:italic;
}
.editor code {
  font-family:'Geist Mono',monospace;
  font-size:12px;
  background:var(--bg3);
  border:1px solid var(--border2);
  padding:1px 5px;
  border-radius:4px;
  color:var(--accent);
}
.editor pre {
  background:var(--bg2);
  border:1px solid var(--border2);
  border-radius:8px;
  padding:14px 16px;
  margin:12px 0;
  overflow-x:auto;
}
.editor pre code { background:none; border:none; padding:0; font-size:12px; color:var(--text2); }
.editor hr { border:none; border-top:1px solid var(--border2); margin:20px 0; }
.editor mark { background:rgba(212,168,67,.25); color:var(--accent); padding:1px 3px; border-radius:3px; }
.editor a { color:var(--blue); text-decoration:underline; text-decoration-color:rgba(85,136,224,.4); }

/* Empty state */
.empty-state {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:var(--text3); text-align:center; padding:40px; gap:14px;
}
.empty-state .big { font-family:'Instrument Serif',serif; font-size:28px; color:var(--text2); }
.empty-state .sub { font-size:13px; line-height:1.6; max-width:300px; }
.empty-state .new-btn {
  margin-top:8px; padding:9px 20px;
  background:var(--accent); color:#000; border:none; border-radius:8px;
  font-family:'Geist Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  cursor:pointer; transition:opacity .15s;
}
.empty-state .new-btn:hover { opacity:.85; }

/* ── MODAL ── */
.modal-ov {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.6);
  z-index:300; align-items:center; justify-content:center; padding:20px;
}
.modal-ov.on { display:flex; }
.modal {
  background:var(--bg2); border:1px solid var(--border2); border-radius:12px;
  width:100%; max-width:360px; padding:24px;
}
.modal-title { font-family:'Instrument Serif',serif; font-size:20px; margin-bottom:16px; }
.modal-inp {
  width:100%; background:var(--bg3); border:1px solid var(--border2); border-radius:8px;
  color:var(--text); font-family:'Geist',sans-serif; font-size:14px;
  padding:10px 12px; outline:none; margin-bottom:12px;
}
.modal-inp:focus { border-color:var(--accent); }
.modal-lbl { font-family:'Geist Mono',monospace; font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--text3); margin-bottom:8px; display:block; }
.color-row { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
.color-swatch {
  width:28px; height:28px; border-radius:50%; cursor:pointer;
  border:2px solid transparent; transition:all .12s;
}
.color-swatch.sel { border-color:#fff; transform:scale(1.15); }
.modal-btns { display:flex; gap:8px; }
.mbtn { flex:1; padding:9px; border-radius:8px; border:none; cursor:pointer; font-family:'Geist Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; transition:all .15s; }
.mbtn-ok { background:var(--accent); color:#000; }
.mbtn-ok:hover { opacity:.85; }
.mbtn-cn { background:var(--bg3); border:1px solid var(--border2); color:var(--text2); }
.mbtn-cn:hover { border-color:var(--accent); color:var(--accent); }

/* ── EXPORT TOAST ── */
.toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--bg3); border:1px solid var(--border2); border-radius:8px;
  padding:10px 18px; font-family:'Geist Mono',monospace; font-size:11px; color:var(--text2);
  z-index:400; transition:transform .25s ease;
  display:flex; align-items:center; gap:8px;
}
.toast.show { transform:translateX(-50%) translateY(0); }
.toast-dot { width:6px; height:6px; border-radius:50%; background:var(--green); }

/* Scrollbar */
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

/* Responsive */
@media (max-width:640px) {
  .sidebar { width:100%; position:absolute; z-index:50; height:100%; }
  .sidebar.collapsed { width:0; }
  .ed-header, .ed-tags, .ed-meta { padding-left:18px; padding-right:18px; }
  .ed-content { padding:20px 18px 80px; }
  .toolbar { padding:8px 12px; }
}
</style>
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sb-top">
      <div class="sb-brand">✦ <span>Caderno</span></div>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input class="search-inp" id="searchInp" placeholder="Buscar notas..." oninput="doSearch(this.value)">
      </div>
    </div>

    <div class="sb-section">
      <div class="sb-section-lbl">Cadernos</div>
      <div class="nb-list" id="nbList"></div>
      <div class="nb-add" onclick="openNbModal()">
        <span style="font-size:16px;line-height:1">+</span>
        <span style="font-size:12px">Novo caderno</span>
      </div>
    </div>

    <div class="sb-section" style="padding-bottom:4px">
      <div class="sb-section-lbl">Notas</div>
    </div>
    <div class="sb-notes" id="noteList"></div>
  </div>

  <!-- EDITOR -->
  <div class="editor-area" id="editorArea">

    <!-- Toolbar -->
    <div class="toolbar">
      <button class="sb-toggle" onclick="toggleSidebar()" title="Sidebar">☰</button>
      <div class="tb-group">
        <button class="tbtn" onclick="execCmd('bold')" title="Negrito"><b>B</b></button>
        <button class="tbtn" onclick="execCmd('italic')" title="Itálico"><i>I</i></button>
        <button class="tbtn" onclick="execCmd('underline')" title="Sublinhado"><u>U</u></button>
        <button class="tbtn" onclick="execCmd('strikeThrough')" title="Tachado"><s>S</s></button>
        <button class="tbtn" onclick="execCmd('hiliteColor','#d4a84340')" title="Destaque">▣</button>
      </div>
      <div class="tb-sep"></div>
      <div class="tb-group">
        <button class="tbtn tbtn-wide" onclick="execBlock('h1')" title="H1">H1</button>
        <button class="tbtn tbtn-wide" onclick="execBlock('h2')" title="H2">H2</button>
        <button class="tbtn tbtn-wide" onclick="execBlock('h3')" title="H3">H3</button>
        <button class="tbtn tbtn-wide" onclick="execBlock('p')" title="Parágrafo">¶</button>
      </div>
      <div class="tb-sep"></div>
      <div class="tb-group">
        <button class="tbtn" onclick="execCmd('insertUnorderedList')" title="Lista">≡</button>
        <button class="tbtn" onclick="execCmd('insertOrderedList')" title="Lista num.">№</button>
        <button class="tbtn" onclick="insertBlockquote()" title="Citação">❝</button>
        <button class="tbtn" onclick="insertCode()" title="Código">&lt;/&gt;</button>
        <button class="tbtn" onclick="execCmd('insertHorizontalRule')" title="Divisor">—</button>
      </div>
      <div class="tb-sep"></div>
      <div class="tb-group">
        <button class="tbtn" onclick="newNote()" title="Nova nota" style="color:var(--accent)">✦</button>
        <button class="tbtn" onclick="exportNote()" title="Exportar">↑</button>
        <button class="tbtn" onclick="deleteNote()" title="Apagar nota" style="font-size:12px">✕</button>
      </div>
    </div>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <div class="big">Nenhuma nota aberta</div>
      <div class="sub">Selecione uma nota na barra lateral ou crie uma nova para começar.</div>
      <button class="new-btn" onclick="newNote()">+ Nova nota</button>
    </div>

    <!-- Note editor (hidden until note selected) -->
    <div id="noteEditor" style="display:none;flex:1;display:none;flex-direction:column;overflow:hidden;">
      <div class="ed-header">
        <div class="ed-notebook-badge" id="edNbBadge" onclick="openNbPicker()">
          <div class="ed-nb-dot" id="edNbDot"></div>
          <span id="edNbName">—</span>
        </div>
        <textarea class="ed-title-inp" id="edTitle" placeholder="Título da nota..." rows="1" oninput="autoResize(this);autoSave()"></textarea>
      </div>
      <div class="ed-tags" id="edTags"></div>
      <div class="ed-meta">
        <div class="ed-meta-item">📅 <span id="edDate">—</span></div>
        <div class="ed-meta-item">✏️ <span id="edWords">0 palavras</span></div>
      </div>
      <div class="ed-content">
        <div class="editor" id="editor" contenteditable="true"
          data-placeholder="Comece a escrever..."
          oninput="autoSave();updateWordCount()"
          onkeydown="handleEditorKey(event)">
        </div>
      </div>
    </div>

  </div>
</div>

<!-- New Notebook Modal -->
<div class="modal-ov" id="nbModal">
  <div class="modal">
    <div class="modal-title">Novo caderno</div>
    <span class="modal-lbl">Nome</span>
    <input class="modal-inp" id="nbNameInp" placeholder="Ex: Álgebra, Inglês..." maxlength="32">
    <span class="modal-lbl">Cor</span>
    <div class="color-row" id="colorRow"></div>
    <div class="modal-btns">
      <button class="mbtn mbtn-cn" onclick="closeNbModal()">Cancelar</button>
      <button class="mbtn mbtn-ok" onclick="saveNotebook()">Criar</button>
    </div>
  </div>
</div>

<!-- Notebook Picker Modal -->
<div class="modal-ov" id="nbPickerModal">
  <div class="modal">
    <div class="modal-title">Mover para caderno</div>
    <div id="nbPickerList" style="display:flex;flex-direction:column;gap:4px;margin-bottom:16px;max-height:260px;overflow-y:auto;"></div>
    <div class="modal-btns">
      <button class="mbtn mbtn-cn" onclick="closeNbPicker()">Cancelar</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <div class="toast-dot"></div>
  <span id="toastMsg">Copiado!</span>
</div>

<script>
// ── STATE ─────────────────────────────────────────────────────
var state = { notebooks:[], notes:[], curNoteId:null, curNbId:'all', selColor:'#5588e0' };

var COLORS = ['#5588e0','#55b87a','#d4a843','#9955e0','#e055aa','#e05555','#55cce0','#a0a0a0'];

function load() {
  try {
    var s = JSON.parse(localStorage.getItem('caderno2') || 'null');
    if (s) { state.notebooks = s.notebooks||[]; state.notes = s.notes||[]; }
  } catch(e){}
  if (!state.notebooks.length) {
    state.notebooks = [
      {id:'nb1', name:'USP',      color:'#5588e0'},
      {id:'nb2', name:'Idiomas',  color:'#55b87a'},
      {id:'nb3', name:'Trabalho', color:'#d4a843'},
      {id:'nb4', name:'Pessoal',  color:'#e055aa'},
    ];
  }
}
function save() {
  try { localStorage.setItem('caderno2', JSON.stringify({notebooks:state.notebooks,notes:state.notes})); } catch(e){}
}

// ── UTILS ─────────────────────────────────────────────────────
function uid() { return 'n'+Date.now()+Math.random().toString(36).slice(2,6); }
function fmtDate(iso) {
  var d = new Date(iso);
  var day = d.getDate(), mo = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][d.getMonth()];
  return day+' '+mo+' '+d.getFullYear();
}
function wordCount(html) {
  var txt = html.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
  return txt ? txt.split(' ').length : 0;
}
function getNb(id) { return state.notebooks.find(function(n){return n.id===id;}); }
function getNote(id) { return state.notes.find(function(n){return n.id===id;}); }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── RENDER NOTEBOOKS ──────────────────────────────────────────
function renderNbs() {
  var list = document.getElementById('nbList');
  list.innerHTML = '';

  // "Todas" item
  var all = document.createElement('div');
  all.className = 'nb-item' + (state.curNbId==='all'?' active':'');
  all.innerHTML = '<div class="nb-dot" style="background:#555"></div><div class="nb-name">Todas as notas</div><div class="nb-count">'+state.notes.length+'</div>';
  all.onclick = function(){ state.curNbId='all'; renderNbs(); renderNoteList(); };
  list.appendChild(all);

  state.notebooks.forEach(function(nb){
    var count = state.notes.filter(function(n){return n.nbId===nb.id;}).length;
    var item = document.createElement('div');
    item.className = 'nb-item'+(state.curNbId===nb.id?' active':'');
    item.innerHTML = '<div class="nb-dot" style="background:'+nb.color+'"></div>'
      +'<div class="nb-name">'+esc(nb.name)+'</div>'
      +'<div class="nb-count">'+count+'</div>';
    item.onclick = function(){ state.curNbId=nb.id; renderNbs(); renderNoteList(); };
    list.appendChild(item);
  });
}

// ── RENDER NOTE LIST ─────────────────────────────────────────
function renderNoteList(filter) {
  var list = document.getElementById('noteList');
  var notes = state.notes.filter(function(n){
    if (state.curNbId !== 'all' && n.nbId !== state.curNbId) return false;
    if (filter) {
      var q = filter.toLowerCase();
      return n.title.toLowerCase().includes(q) || (n.content||'').toLowerCase().includes(q) || (n.tags||[]).some(function(t){return t.toLowerCase().includes(q);});
    }
    return true;
  }).sort(function(a,b){ return new Date(b.updated) - new Date(a.updated); });

  list.innerHTML = '';
  if (!notes.length) {
    list.innerHTML = '<div class="empty-notes">Nenhuma nota aqui.<br>Crie a primeira com ✦</div>';
    return;
  }
  notes.forEach(function(note){
    var nb = getNb(note.nbId);
    var item = document.createElement('div');
    item.className = 'note-item'+(state.curNoteId===note.id?' active':'');
    var preview = (note.content||'').replace(/<[^>]*>/g,' ').slice(0,60);
    item.innerHTML =
      '<div class="ni-title">'+(note.title||'Sem título')+'</div>'
      +'<div class="ni-meta">'
        +'<span class="ni-date">'+fmtDate(note.updated)+'</span>'
        +(nb?'<span class="ni-tag" style="background:'+nb.color+'22;color:'+nb.color+'">'+esc(nb.name)+'</span>':'')
        +((note.tags||[]).slice(0,2).map(function(t){return '<span class="ni-tag" style="background:var(--bg3);color:var(--text3)">#'+esc(t)+'</span>';}).join(''))
      +'</div>'
      +(preview?'<div class="ni-preview">'+esc(preview)+'</div>':'');
    item.onclick = function(){ openNote(note.id); };
    list.appendChild(item);
  });
}

// ── OPEN NOTE ────────────────────────────────────────────────
function openNote(id) {
  state.curNoteId = id;
  var note = getNote(id);
  if (!note) return;

  document.getElementById('emptyState').style.display = 'none';
  var ne = document.getElementById('noteEditor');
  ne.style.display = 'flex';

  var nb = getNb(note.nbId);
  document.getElementById('edNbDot').style.background = nb ? nb.color : '#555';
  document.getElementById('edNbName').textContent = nb ? nb.name : '—';
  document.getElementById('edTitle').value = note.title || '';
  autoResize(document.getElementById('edTitle'));
  document.getElementById('editor').innerHTML = note.content || '';
  document.getElementById('edDate').textContent = fmtDate(note.updated);
  updateWordCount();
  renderTags(note.tags||[]);
  renderNoteList(document.getElementById('searchInp').value);
}

// ── TAGS ─────────────────────────────────────────────────────
function renderTags(tags) {
  var row = document.getElementById('edTags');
  row.innerHTML = '';
  tags.forEach(function(tag, i){
    var chip = document.createElement('div');
    chip.className = 'tag-chip';
    chip.innerHTML = '#'+esc(tag)+'<span class="tx" data-i="'+i+'">✕</span>';
    chip.querySelector('.tx').onclick = function(e){
      e.stopPropagation();
      var note = getNote(state.curNoteId);
      note.tags.splice(i,1);
      autoSave();
      renderTags(note.tags);
    };
    row.appendChild(chip);
  });
  var inp = document.createElement('input');
  inp.className = 'tag-add';
  inp.placeholder = '+ tag';
  inp.maxLength = 20;
  inp.onkeydown = function(e){
    if ((e.key==='Enter'||e.key===','||e.key===' ') && inp.value.trim()) {
      e.preventDefault();
      var note = getNote(state.curNoteId);
      var t = inp.value.trim().replace(/[^a-zA-Z0-9áéíóúàâêôãõçüÁÉÍÓÚÀÂÊÔÃÕÇÜ_-]/g,'');
      if (t && !note.tags.includes(t)) { note.tags.push(t); autoSave(); renderTags(note.tags); }
      else { inp.value=''; }
    }
  };
  row.appendChild(inp);
}

// ── NEW NOTE ─────────────────────────────────────────────────
function newNote() {
  var nbId = state.curNbId==='all' ? (state.notebooks[0]||{id:'misc'}).id : state.curNbId;
  var note = { id:uid(), nbId:nbId, title:'', content:'', tags:[], created:new Date().toISOString(), updated:new Date().toISOString() };
  state.notes.unshift(note);
  save();
  renderNbs();
  openNote(note.id);
  setTimeout(function(){ document.getElementById('edTitle').focus(); }, 50);
}

// ── AUTO SAVE ────────────────────────────────────────────────
var saveTimer = null;
function autoSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    var note = getNote(state.curNoteId);
    if (!note) return;
    note.title = document.getElementById('edTitle').value.trim() || 'Sem título';
    note.content = document.getElementById('editor').innerHTML;
    note.updated = new Date().toISOString();
    save();
    renderNbs();
    renderNoteList(document.getElementById('searchInp').value);
  }, 600);
}

// ── DELETE NOTE ──────────────────────────────────────────────
function deleteNote() {
  if (!state.curNoteId) return;
  if (!confirm('Apagar esta nota?')) return;
  state.notes = state.notes.filter(function(n){return n.id!==state.curNoteId;});
  state.curNoteId = null;
  save();
  renderNbs();
  renderNoteList();
  document.getElementById('noteEditor').style.display = 'none';
  document.getElementById('emptyState').style.display = 'flex';
}

// ── EXPORT ───────────────────────────────────────────────────
function exportNote() {
  var note = getNote(state.curNoteId);
  if (!note) return;
  var text = (note.title?note.title+'\n\n':'') + (note.content||'').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]*>/g,'');
  navigator.clipboard.writeText(text).then(function(){
    showToast('Copiado para área de transferência!');
  }).catch(function(){
    // fallback: download
    var a = document.createElement('a');
    a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(text);
    a.download = (note.title||'nota')+'.txt';
    a.click();
    showToast('Baixando como .txt');
  });
}

function showToast(msg) {
  var t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

// ── TOOLBAR COMMANDS ─────────────────────────────────────────
function execCmd(cmd, val) {
  document.getElementById('editor').focus();
  document.execCommand(cmd, false, val||null);
  autoSave();
}
function execBlock(tag) {
  document.getElementById('editor').focus();
  document.execCommand('formatBlock', false, tag);
  autoSave();
}
function insertBlockquote() {
  document.getElementById('editor').focus();
  document.execCommand('formatBlock', false, 'blockquote');
  autoSave();
}
function insertCode() {
  document.getElementById('editor').focus();
  var sel = window.getSelection();
  if (sel && sel.toString()) {
    document.execCommand('insertHTML', false, '<code>'+sel.toString()+'</code>');
  } else {
    document.execCommand('insertHTML', false, '<code>código</code>');
  }
  autoSave();
}
function handleEditorKey(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    document.execCommand('insertHTML', false, '&nbsp;&nbsp;&nbsp;&nbsp;');
  }
}

// ── WORD COUNT ───────────────────────────────────────────────
function updateWordCount() {
  var n = wordCount(document.getElementById('editor').innerHTML);
  document.getElementById('edWords').textContent = n + (n===1?' palavra':' palavras');
}

// ── AUTO RESIZE TEXTAREA ─────────────────────────────────────
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

// ── SIDEBAR TOGGLE ───────────────────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

// ── SEARCH ───────────────────────────────────────────────────
function doSearch(q) {
  state.curNbId = 'all';
  renderNbs();
  renderNoteList(q);
}

// ── NOTEBOOK MODAL ───────────────────────────────────────────
function openNbModal() {
  state.selColor = COLORS[0];
  document.getElementById('nbNameInp').value = '';
  buildColorRow();
  document.getElementById('nbModal').classList.add('on');
  setTimeout(function(){ document.getElementById('nbNameInp').focus(); }, 80);
}
function closeNbModal() { document.getElementById('nbModal').classList.remove('on'); }
function buildColorRow() {
  var row = document.getElementById('colorRow'); row.innerHTML='';
  COLORS.forEach(function(c){
    var sw = document.createElement('div');
    sw.className='color-swatch'+(c===state.selColor?' sel':'');
    sw.style.background=c;
    sw.onclick=function(){ state.selColor=c; buildColorRow(); };
    row.appendChild(sw);
  });
}
function saveNotebook() {
  var name = document.getElementById('nbNameInp').value.trim();
  if (!name) { document.getElementById('nbNameInp').focus(); return; }
  var nb = {id:'nb'+Date.now(), name:name, color:state.selColor};
  state.notebooks.push(nb);
  save(); closeNbModal(); renderNbs();
}

// ── NOTEBOOK PICKER ──────────────────────────────────────────
function openNbPicker() {
  if (!state.curNoteId) return;
  var list = document.getElementById('nbPickerList'); list.innerHTML='';
  state.notebooks.forEach(function(nb){
    var item = document.createElement('div');
    item.className = 'nb-item';
    item.style.cssText='border-radius:7px;cursor:pointer;padding:8px 10px;';
    item.innerHTML='<div class="nb-dot" style="background:'+nb.color+'"></div><div class="nb-name" style="color:var(--text)">'+esc(nb.name)+'</div>';
    item.onmouseenter=function(){this.style.background='var(--bg3)';};
    item.onmouseleave=function(){this.style.background='';};
    item.onclick=function(){
      var note=getNote(state.curNoteId);
      note.nbId=nb.id;
      autoSave();
      document.getElementById('edNbDot').style.background=nb.color;
      document.getElementById('edNbName').textContent=nb.name;
      closeNbPicker(); renderNbs();
    };
    list.appendChild(item);
  });
  document.getElementById('nbPickerModal').classList.add('on');
}
function closeNbPicker() { document.getElementById('nbPickerModal').classList.remove('on'); }

// close modals on overlay click
document.getElementById('nbModal').addEventListener('click',function(e){if(e.target===this)closeNbModal();});
document.getElementById('nbPickerModal').addEventListener('click',function(e){if(e.target===this)closeNbPicker();});

// ── KEYBOARD SHORTCUTS ───────────────────────────────────────
document.addEventListener('keydown', function(e){
  if ((e.metaKey||e.ctrlKey) && e.key==='n') { e.preventDefault(); newNote(); }
  if ((e.metaKey||e.ctrlKey) && e.key==='e') { e.preventDefault(); exportNote(); }
  if ((e.metaKey||e.ctrlKey) && e.key==='\\') { e.preventDefault(); toggleSidebar(); }
});

// ── INIT ─────────────────────────────────────────────────────
load();
renderNbs();
renderNoteList();
// Open first note if any
if (state.notes.length) openNote(state.notes[0].id);
</script>
