<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Calendário 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ec;--surface:#fff;--s2:#eeebe4;--border:#ddd8ce;
  --accent:#9a6f30;--abg:#f7eed8;--text:#1a1714;--muted:#8a8278;--dim:#d0c8bc;
  --nat:#2578a0;--esp:#b84e18;--trab:#806018;--est:#6040a8;--idi:#9a3058;--hob:#2a7040;
  --rh:27px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;}

/* ─── HEADER ─── */
.hdr{position:sticky;top:0;z-index:100;background:var(–bg);border-bottom:1px solid var(–border);padding:13px 22px 10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.hdr-l .lbl{font-family:‘DM Mono’,monospace;font-size:9px;letter-spacing:.2em;color:var(–accent);text-transform:uppercase;margin-bottom:3px;}
.hdr-l h1{font-family:‘Playfair Display’,serif;font-size:clamp(16px,2.4vw,24px);font-weight:900;letter-spacing:-.02em;}
.hdr-l h1 span{color:var(–accent);}
.hdr-r{display:flex;align-items:center;gap:6px;}
.nbtn{background:var(–surface);border:1px solid var(–border);color:var(–muted);width:32px;height:32px;border-radius:6px;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.nbtn:hover{border-color:var(–accent);color:var(–accent);}
.rlbl{font-family:‘DM Mono’,monospace;font-size:10px;color:var(–muted);min-width:106px;text-align:center;}
.tbtn{padding:6px 12px;font-family:‘DM Mono’,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;background:var(–surface);border:1px solid var(–border);border-radius:6px;color:var(–muted);cursor:pointer;transition:all .15s;}
.tbtn:hover{border-color:var(–accent);color:var(–accent);}

.fbar{padding:7px 22px;background:var(–surface);border-bottom:1px solid var(–border);font-size:12px;color:var(–muted);line-height:1.5;}
.fbar strong{color:var(–text);}
.ftag{font-family:‘DM Mono’,monospace;font-size:9px;letter-spacing:.12em;color:var(–accent);background:var(–abg);border:1px solid var(–dim);padding:2px 7px;border-radius:2px;margin-right:8px;}

.lbar{display:flex;flex-wrap:wrap;gap:10px;padding:7px 22px;border-bottom:1px solid var(–border);}
.leg{display:flex;align-items:center;gap:5px;font-family:‘DM Mono’,monospace;font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(–muted);}
.ldot{width:7px;height:7px;border-radius:2px;}

/* ─── RESPONSIVE ─── */
.dv{display:none;}.mv{display:block;}
@media(min-width:768px){.dv{display:block;}.mv{display:none;}}

/* ─── DESKTOP GRID ─── */
.cw{padding:14px 22px 60px;overflow-x:auto;}
.cg{display:grid;grid-template-columns:52px repeat(7,1fr);border:1px solid var(–border);border-radius:8px;overflow:hidden;background:var(–border);gap:1px;min-width:720px;}
.the{background:var(–s2);border-bottom:1px solid var(–border);}
.dhdr{background:var(–s2);padding:9px 6px;text-align:center;}
.dhdr.wk{background:#ede8df;}
.dhdr.td .dn{color:var(–accent);}
.dhdr.td .dd{color:var(–accent);}
.dn{font-family:‘DM Mono’,monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(–muted);margin-bottom:2px;}
.dd{font-family:‘Playfair Display’,serif;font-size:16px;font-weight:700;color:var(–text);line-height:1;}
.tcol{background:var(–s2);}
.ts{display:flex;align-items:flex-start;justify-content:flex-end;padding:2px 5px 0;}
.ts span{font-family:‘DM Mono’,monospace;font-size:8px;color:var(–muted);}
.dcol{position:relative;background:var(–surface);}
.dcol.wk{background:#faf8f3;}
.hl{position:absolute;left:0;right:0;border-bottom:1px solid var(–border);pointer-events:none;}
.hl.hr{border-color:var(–dim);}
/* desktop events */
.ev{position:absolute;left:2px;right:2px;border-radius:3px;padding:3px 5px;cursor:pointer;overflow:hidden;border-left:3px solid transparent;transition:filter .15s;}
.ev:hover{filter:brightness(.93);}
.evl{font-family:‘DM Mono’,monospace;font-size:8px;letter-spacing:.05em;text-transform:uppercase;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.evt{font-size:8px;opacity:.55;margin-top:1px;}
.evn{font-size:9px;margin-top:2px;font-style:italic;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ev.nat{background:rgba(37,120,160,.1);border-color:var(–nat);color:var(–nat);}
.ev.esp{background:rgba(184,78,24,.09);border-color:var(–esp);color:var(–esp);}
.ev.trab{background:rgba(128,96,24,.09);border-color:var(–trab);color:var(–trab);}
.ev.est{background:rgba(96,64,168,.09);border-color:var(–est);color:var(–est);}
.ev.idi{background:rgba(154,48,88,.09);border-color:var(–idi);color:var(–idi);}
.ev.hob{background:rgba(42,112,64,.09);border-color:var(–hob);color:var(–hob);}
.ev.liv{background:rgba(180,168,150,.13);border-color:var(–dim);color:var(–muted);}
.ev.cus{background:var(–abg);border-color:var(–accent);color:var(–accent);}
/* empty slot */
.esl{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s;}
.esl:hover{opacity:1;background:rgba(154,111,48,.07);}
.esl span{font-family:‘DM Mono’,monospace;font-size:8px;color:var(–muted);}

/* ─── MOBILE ─── */
.mdnav{padding:12px 18px 6px;display:flex;align-items:center;gap:8px;}
.dnb{background:var(–surface);border:1px solid var(–border);color:var(–muted);width:38px;height:38px;border-radius:8px;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.dnb:active{border-color:var(–accent);}
.dc{flex:1;text-align:center;}
.dbig{font-family:‘Playfair Display’,serif;font-size:22px;font-weight:900;color:var(–text);}
.dbig.td{color:var(–accent);}
.dsub{font-family:‘DM Mono’,monospace;font-size:9px;color:var(–muted);margin-top:2px;}
.wstrip{display:flex;gap:3px;padding:0 18px 8px;overflow-x:auto;scrollbar-width:none;}
.wstrip::-webkit-scrollbar{display:none;}
.wc{flex:1;min-width:34px;padding:6px 3px;border-radius:6px;text-align:center;cursor:pointer;border:1px solid transparent;}
.wc.act{background:var(–abg);border-color:var(–accent);}
.wc.itd .wn::after{content:’’;display:block;width:4px;height:4px;background:var(–accent);border-radius:50%;margin:2px auto 0;}
.wdn{font-family:‘DM Mono’,monospace;font-size:8px;text-transform:uppercase;color:var(–muted);}
.wn{font-family:‘Playfair Display’,serif;font-size:14px;font-weight:700;color:var(–muted);}
.wc.act .wdn,.wc.act .wn{color:var(–text);}
.wc.act .wn{color:var(–accent);}
.tl{padding:4px 18px 100px;}
.tb{display:flex;gap:10px;margin-bottom:5px;}
.tbt{width:42px;flex-shrink:0;font-family:‘DM Mono’,monospace;font-size:10px;color:var(–muted);padding-top:11px;text-align:right;}
.tbc{flex:1;border-radius:10px;padding:10px 13px;border-left:3px solid transparent;cursor:pointer;transition:filter .15s;}
.tbc:active{filter:brightness(.95);}
.tbc.nat{background:rgba(37,120,160,.09);border-color:var(–nat);}
.tbc.esp{background:rgba(184,78,24,.08);border-color:var(–esp);}
.tbc.trab{background:rgba(128,96,24,.08);border-color:var(–trab);}
.tbc.est{background:rgba(96,64,168,.08);border-color:var(–est);}
.tbc.idi{background:rgba(154,48,88,.08);border-color:var(–idi);}
.tbc.hob{background:rgba(42,112,64,.08);border-color:var(–hob);}
.tbc.liv{background:rgba(180,168,150,.12);border-color:var(–dim);}
.tbc.cus{background:var(–abg);border-color:var(–accent);}
.tbh{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.tbl{font-family:‘DM Mono’,monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;}
.nat .tbl{color:var(–nat);}.esp .tbl{color:var(–esp);}.trab .tbl{color:var(–trab);}
.est .tbl{color:var(–est);}.idi .tbl{color:var(–idi);}.hob .tbl{color:var(–hob);}
.liv .tbl{color:var(–muted);}.cus .tbl{color:var(–accent);}
.tbr{font-size:10px;color:var(–muted);}
.tbn{font-size:12px;margin-top:4px;font-style:italic;line-height:1.4;color:var(–text);}
.tba{font-family:‘DM Mono’,monospace;font-size:9px;color:var(–dim);margin-top:3px;}
.ndot{width:5px;height:5px;background:var(–accent);border-radius:50%;flex-shrink:0;}
.fab{position:fixed;bottom:26px;right:18px;width:52px;height:52px;border-radius:50%;background:var(–accent);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 20px rgba(154,111,48,.35);border:none;z-index:50;}
.fab:active{transform:scale(.92);}

/* ─── MODAL ─── */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center;}
.ov.on{display:flex;}
@media(min-width:768px){
.ov{align-items:center;padding:24px;}
.mo{border-radius:12px!important;max-height:86vh;}
}
.mo{
background:var(–surface);border:1px solid var(–border);border-top:3px solid var(–accent);
border-radius:16px 16px 0 0;width:100%;max-width:500px;
display:flex;flex-direction:column;max-height:92vh;
}
.mo-body{padding:16px 18px 0;overflow-y:auto;flex:1;min-height:0;}
.mo-foot{padding:10px 18px 28px;border-top:1px solid var(–border);}
@media(min-width:768px){.mo-foot{padding:10px 18px 14px;}}
.moh{width:36px;height:4px;background:var(–dim);border-radius:2px;margin:0 auto 14px;}
.mot{font-family:‘Playfair Display’,serif;font-size:17px;color:var(–text);margin-bottom:2px;}
.mos{font-family:‘DM Mono’,monospace;font-size:9px;letter-spacing:.12em;color:var(–muted);text-transform:uppercase;margin-bottom:12px;}
.slbl{font-family:‘DM Mono’,monospace;font-size:9px;letter-spacing:.1em;color:var(–muted);text-transform:uppercase;margin-bottom:7px;margin-top:12px;}
.tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:4px;}
@media(min-width:400px){.tgrid{grid-template-columns:repeat(6,1fr);}}
.tch{background:var(–s2);border:1px solid var(–border);border-radius:5px;padding:6px 2px;text-align:center;font-family:‘DM Mono’,monospace;font-size:9.5px;color:var(–muted);cursor:pointer;transition:all .15s;}
.tch:hover,.tch.sl{background:var(–abg);border-color:var(–accent);color:var(–accent);font-weight:500;}
.mo textarea{width:100%;background:var(–s2);border:1px solid var(–border);border-radius:8px;color:var(–text);font-family:‘DM Sans’,sans-serif;font-size:14px;padding:10px;resize:none;height:90px;outline:none;line-height:1.5;margin-top:12px;margin-bottom:0;}
.mo textarea:focus{border-color:var(–accent);}
.mo textarea::placeholder{color:var(–muted);}
.mact{display:flex;gap:6px;}
.btn{font-family:‘DM Mono’,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:10px 10px;border-radius:8px;cursor:pointer;border:none;flex:1;text-align:center;transition:all .15s;}
.bsv{background:var(–accent);color:#fff;}
.bsv:hover{opacity:.9;}
.bcn{background:var(–s2);border:1px solid var(–border);color:var(–muted);}
.bcn:hover{border-color:var(–accent);color:var(–accent);}
.bdl{background:#fff0f0;border:1px solid #f0c0c0;color:#b03030;flex:.8;}
.bdl:hover{background:#ffe0e0;}
</style>

</head>
<body>

<div class="hdr">
  <div class="hdr-l">
    <div class="lbl">Calendário · Mai–Dez 2026</div>
    <h1>Semana de <span id="hdrTitle">...</span></h1>
  </div>
  <div class="hdr-r">
    <button class="tbtn" onclick="goToday()">Hoje</button>
    <button class="nbtn" onclick="chWk(-1)">‹</button>
    <div class="rlbl" id="rlbl">...</div>
    <button class="nbtn" onclick="chWk(1)">›</button>
  </div>
</div>

<div class="fbar"><span class="ftag" id="ftag"></span><span id="ftxt"></span></div>

<div class="lbar">
  <div class="leg"><div class="ldot" style="background:var(--nat)"></div>Natação</div>
  <div class="leg"><div class="ldot" style="background:var(--esp)"></div>Esporte</div>
  <div class="leg"><div class="ldot" style="background:var(--trab)"></div>Trabalho</div>
  <div class="leg"><div class="ldot" style="background:var(--est)"></div>Estudos</div>
  <div class="leg"><div class="ldot" style="background:var(--idi)"></div>Idioma</div>
  <div class="leg"><div class="ldot" style="background:var(--hob)"></div>Hobby</div>
  <div class="leg"><div class="ldot" style="background:var(--accent)"></div>Nota</div>
</div>

<!-- DESKTOP -->

<div class="dv"><div class="cw"><div class="cg" id="dg"></div></div></div>

<!-- MOBILE -->

<div class="mv">
  <div class="mdnav">
    <button class="dnb" onclick="chDay(-1)">‹</button>
    <div class="dc">
      <div class="dbig" id="dname">...</div>
      <div class="dsub" id="dsub">...</div>
    </div>
    <button class="dnb" onclick="chDay(1)">›</button>
  </div>
  <div class="wstrip" id="wstrip"></div>
  <div class="tl" id="tl"></div>
  <button class="fab" onclick="openAdd(null)">+</button>
</div>

<!-- UNIFIED MODAL -->

<div class="ov" id="modal">
  <div class="mo">
    <div class="mo-body" id="mbody">
      <div class="moh"></div>
      <div class="mot" id="mtit"></div>
      <div class="mos" id="msub"></div>
      <!-- time picker (shown for new notes) -->
      <div id="tpicker" style="display:none">
        <div class="slbl">Horário</div>
        <div class="tgrid" id="tgrid"></div>
      </div>
      <!-- note textarea -->
      <div class="slbl" id="notelbl">Nota</div>
      <textarea id="mnote" placeholder="Nota, tarefa, lembrete..."></textarea>
    </div>
    <div class="mo-foot">
      <div class="mact">
        <button class="btn bdl" id="bdel" onclick="doDelete()">Apagar</button>
        <button class="btn bcn" onclick="closeModal()">Cancelar</button>
        <button class="btn bsv" onclick="doSave()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<script>
var TODAY=new Date(), curDay=new Date(TODAY), wkOff=0, mKey=null, selT=null;
var notes={};
try{notes=JSON.parse(localStorage.getItem('g26')||'{}');}catch(e){}

var DN=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
var DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
var MN=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var DW=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];

var MI={
  4:{t:'Maio · Base',        x:'<strong>Reconstrução de base.</strong> Natação, sono regulado, tecnólogo em ritmo.'},
  5:{t:'Junho · Movimento',  x:'<strong>Movimento volta.</strong> Corrida 3x/sem, espanhol 15min/dia, yoga experimental.'},
  6:{t:'Julho · USP',        x:'<strong>USP retorna.</strong> Inglês corporativo, 1 livro, explorar SP aos sábados.'},
  7:{t:'Agosto · Cert.',     x:'<strong>1ª cert. Salesforce.</strong> Squash no sábado, cozinhar, foco técnico.'},
  8:{t:'Setembro · Social',  x:'<strong>Expansão social.</strong> Pilates, eventos, amigos, inglês consolidando.'},
  9:{t:'Outubro · Piano',    x:'<strong>Piano começa.</strong> Primeiras aulas, viagem, rotina esportiva estável.'},
  10:{t:'Novembro · Cert.2', x:'<strong>2ª cert. Salesforce.</strong> Pilates + corrida + piano, 2º livro.'},
  11:{t:'Dezembro · Colheita',x:'<strong>Balanço e celebrar.</strong> Atualizar LinkedIn, planejar 2027, viagem.'}
};

function p2(n){return n<10?'0'+n:''+n;}
function dk(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function isT(d){return d.getDate()===TODAY.getDate()&&d.getMonth()===TODAY.getMonth()&&d.getFullYear()===TODAY.getFullYear();}
function dom(d){var j=d.getDay();return j===0?6:j-1;}

var SL=[];for(var h=5;h<23;h++){SL.push(p2(h)+':00');SL.push(p2(h)+':30');}SL.push('23:00');
function si(t){var x=t.split(':');return(parseInt(x[0])-5)*2+(parseInt(x[1])>=30?1:0);}
var RH=27;

function gs(mo,dw){
  var iC=(dw===0||dw===2||dw===4),iI=(dw===1||dw===3);
  var wD=dw<=4,iS=dw===5,iSu=dw===6,S=[];
  if(wD){
    S.push({l:'Acorda',s:'05:00',e:'05:30',t:'nat'});
    S.push({l:'Natação',s:'05:30',e:'06:15',t:'nat'});
    S.push({l:'Café & manhã',s:'06:15',e:'08:00',t:'liv'});
    S.push({l:'Trabalho',s:'08:00',e:'12:00',t:'trab'});
    S.push({l:'Almoço',s:'12:00',e:'12:30',t:'liv'});
    if(mo>=5){
      if(iC)S.push({l:'Corrida',s:'12:30',e:'13:30',t:'esp'});
      if(iI){S.push({l:'Espanhol 15min',s:'12:30',e:'13:00',t:'idi'});S.push({l:'Pausa',s:'13:00',e:'14:00',t:'liv'});}
      if(iC)S.push({l:'Pausa',s:'13:30',e:'14:00',t:'liv'});
    }else S.push({l:'Pausa almoço',s:'12:30',e:'14:00',t:'liv'});
    S.push({l:'Trabalho',s:'14:00',e:'17:00',t:'trab'});
    if(mo===4) S.push({l:'Tecnólogo',s:'17:00',e:'20:00',t:'est'});
    else if(mo===5){
      if(dw===4)S.push({l:'Yoga (exp.)',s:'17:00',e:'18:30',t:'esp'});
      if(iC&&dw!==4){S.push({l:'Tecnólogo',s:'17:00',e:'19:30',t:'est'});S.push({l:'Tecnólogo',s:'19:30',e:'21:00',t:'est'});}
      if(iI)S.push({l:'USP',s:'17:00',e:'20:00',t:'est'});
      if(dw===4)S.push({l:'Tecnólogo',s:'18:30',e:'20:30',t:'est'});
    }else if(mo===6){
      if(iC){S.push({l:'Tecnólogo',s:'17:00',e:'19:30',t:'est'});S.push({l:'Tecnólogo',s:'19:30',e:'21:00',t:'est'});}
      if(iI){S.push({l:'USP',s:'17:00',e:'19:00',t:'est'});S.push({l:'Inglês corp.',s:'19:00',e:'20:00',t:'idi'});}
    }else if(mo===7){
      if(iC){S.push({l:'Tecnólogo',s:'17:00',e:'19:00',t:'est'});S.push({l:'Cert. Salesforce',s:'19:00',e:'20:30',t:'est'});}
      if(iI){S.push({l:'USP',s:'17:00',e:'19:00',t:'est'});S.push({l:'Inglês corp.',s:'19:00',e:'20:00',t:'idi'});}
    }else if(mo===8){
      if(iI)S.push({l:'Pilates',s:'17:00',e:'18:00',t:'esp'});
      if(iC)S.push({l:'Tecnólogo',s:'17:00',e:'19:00',t:'est'});
      if(iI)S.push({l:'USP',s:'18:00',e:'20:00',t:'est'});
      if(iC)S.push({l:'Inglês corp.',s:'19:00',e:'20:00',t:'idi'});
    }else if(mo===9){
      if(iC)S.push({l:'Tecnólogo',s:'17:00',e:'19:00',t:'est'});
      if(iI)S.push({l:'USP',s:'17:00',e:'19:00',t:'est'});
      if(iI)S.push({l:'Piano',s:'19:00',e:'20:00',t:'hob'});
      if(iC)S.push({l:'Inglês corp.',s:'19:00',e:'20:00',t:'idi'});
    }else if(mo===10){
      if(iI)S.push({l:'Pilates',s:'17:00',e:'18:00',t:'esp'});
      if(iC)S.push({l:'Tecnólogo',s:'17:00',e:'19:00',t:'est'});
      if(iI)S.push({l:'USP',s:'18:00',e:'20:00',t:'est'});
      if(iC){S.push({l:'Cert. SFC 2',s:'19:00',e:'20:30',t:'est'});S.push({l:'Piano',s:'20:30',e:'21:30',t:'hob'});}
    }else if(mo===11){
      if(iC)S.push({l:'Tecnólogo',s:'17:00',e:'19:00',t:'est'});
      if(iI)S.push({l:'USP / Provas',s:'17:00',e:'20:00',t:'est'});
      if(iC)S.push({l:'Piano',s:'19:00',e:'20:00',t:'hob'});

function gwd(off){
  var t=new Date(TODAY),dw=t.getDay();
  var m=new Date(t);m.setDate(t.getDate()-(dw===0?6:dw-1)+off*7);
  var o=[];for(var i=0;i<7;i++){var d=new Date(m);d.setDate(m.getDate()+i);o.push(d);}return o;
}
function fmt(d){return d.getDate()+'/'+(d.getMonth()+1);}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}

function updHdr(dates,mo){
  document.getElementById('hdrTitle').textContent=fmt(dates[0]);
  document.getElementById('rlbl').textContent=fmt(dates[0])+' – '+fmt(dates[6]);
  var i=MI[mo]||{t:MN[mo],x:''};
  document.getElementById('ftag').textContent=i.t;
  document.getElementById('ftxt').innerHTML=i.x;
}

// ── DESKTOP ──────────────────────────────────────────────────────
function rDesk(){
  var dates=gwd(wkOff), mo=dates[0].getMonth();
  updHdr(dates,mo);
  var grid=document.getElementById('dg');grid.innerHTML='';
  var tot=SL.length;
  // header
  var e=document.createElement('div');e.className='the';grid.appendChild(e);
  for(var d=0;d<7;d++){
    var dh=document.createElement('div');
    dh.className='dhdr'+(isT(dates[d])?' td':'')+(d>=5?' wk':'');
    dh.innerHTML='<div class="dn">'+DW[d]+'</div><div class="dd">'+dates[d].getDate()+'</div>';
    grid.appendChild(dh);
  }
  // time col
  var tc=document.createElement('div');tc.className='tcol';tc.style.height=(tot*RH)+'px';
  SL.forEach(function(t,i){
    var ts=document.createElement('div');ts.className='ts';ts.style.height=RH+'px';
    if(i%2===0)ts.innerHTML='<span>'+t+'</span>';tc.appendChild(ts);
  });
  grid.appendChild(tc);
  // day cols
  for(var d=0;d<7;d++){
    var sched=gs(mo,d);
    var evl=[];
    sched.forEach(function(ev){var s=si(ev.s),e2=si(ev.e);if(e2<=s)e2=s+1;evl.push({s:s,e:e2,ev:ev});});
    var occ=new Array(tot).fill(false);
    evl.forEach(function(it){for(var i=it.s;i<it.e&&i<tot;i++)occ[i]=true;});
    var col=document.createElement('div');col.className='dcol'+(d>=5?' wk':'');col.style.height=(tot*RH)+'px';
    for(var i=0;i<tot;i++){var ln=document.createElement('div');ln.className='hl'+(i%2===0?' hr':'');ln.style.top=(i*RH)+'px';col.appendChild(ln);}
    evl.forEach(function(it){
      var tp=it.s*RH,hp=Math.max((it.e-it.s)*RH-3,RH-3);
      var nk=dk(dates[d])+'_'+it.ev.s+'_'+it.ev.l, note=notes[nk]||'';
      var ev=document.createElement('div');ev.className='ev '+it.ev.t;
      ev.style.cssText='top:'+(tp+1)+'px;height:'+hp+'px;';
      ev.setAttribute('data-key',nk);ev.setAttribute('data-label',it.ev.l);ev.setAttribute('data-time',it.ev.s+'–'+it.ev.e);
      ev.onclick=function(){openNote(this,false);};
      ev.innerHTML='<div class="evl">'+it.ev.l+'</div>'+(hp>RH?'<div class="evt">'+it.ev.s+'–'+it.ev.e+'</div>':'')+(note?'<div class="evn">'+esc(note)+'</div>':'');
      col.appendChild(ev);
    });
    // custom notes
    Object.keys(notes).forEach(function(k){
      var pfx=dk(dates[d])+'_';
      if(k.indexOf(pfx)===0&&k.slice(-7)==='_custom'){
        var tp2=k.replace(pfx,'').replace('_custom',''),idx=SL.indexOf(tp2);if(idx===-1)return;
        var cn=document.createElement('div');cn.className='ev cus';
        cn.style.cssText='top:'+(idx*RH+1)+'px;height:'+(RH*2-3)+'px;';
        cn.setAttribute('data-key',k);cn.setAttribute('data-label','Nota · '+tp2);cn.setAttribute('data-time',tp2);
        cn.onclick=function(){openNote(this,false);};
        cn.innerHTML='<div class="evl">Nota</div><div class="evn">'+esc(notes[k])+'</div>';
        col.appendChild(cn);
      }
    });
    // empty slots
    for(var i=0;i<tot;i++){
      if(!occ[i]){
        (function(si2,di){
          var es=document.createElement('div');es.className='esl';
          es.style.cssText='top:'+(si2*RH)+'px;height:'+RH+'px;';
          es.innerHTML='<span>+ nota</span>';
          es.onclick=function(e){
            e.stopPropagation();
            openAdd(dk(dates[di]),DW[di]+' '+dates[di].getDate()+'/'+p2(dates[di].getMonth()+1));
          };
          col.appendChild(es);
        })(i,d);
      }
    }
    grid.appendChild(col);
  }
}

// ── MOBILE ───────────────────────────────────────────────────────
function rMob(){
  var d=curDay, mo=d.getMonth(), dw=dom(d);
  // day header
  var dn=document.getElementById('dname');dn.textContent=DN[d.getDay()];dn.className='dbig'+(isT(d)?' td':'');
  document.getElementById('dsub').textContent=d.getDate()+' de '+MN[mo];
  // week strip
  var st=document.getElementById('wstrip');st.innerHTML='';
  var m=new Date(d);m.setDate(d.getDate()-dw);
  for(var i=0;i<7;i++){
    var dd=new Date(m);dd.setDate(m.getDate()+i);
    var ch=document.createElement('div');ch.className='wc'+(i===dw?' act':'')+(isT(dd)?' itd':'');
    ch.innerHTML='<div class="wdn">'+DS[dd.getDay()]+'</div><div class="wn">'+dd.getDate()+'</div>';
    (function(date){ch.onclick=function(){curDay=new Date(date);rMob();};})(dd);
    st.appendChild(ch);
  }
  // timeline
  var sched=gs(mo,dw), dky=dk(d), tl=document.getElementById('tl');tl.innerHTML='';
  sched.forEach(function(ev){
    var nk=dky+'_'+ev.s+'_'+ev.l, note=notes[nk]||'';
    var bl=document.createElement('div');bl.className='tb';
    var te=document.createElement('div');te.className='tbt';te.textContent=ev.s;
    var ca=document.createElement('div');ca.className='tbc '+ev.t;
    ca.setAttribute('data-key',nk);ca.setAttribute('data-label',ev.l);ca.setAttribute('data-time',ev.s+'–'+ev.e);
    ca.onclick=function(){openNote(this,false);};
    var hd=document.createElement('div');hd.className='tbh';
    var lb=document.createElement('div');lb.className='tbl';lb.textContent=ev.l;
    var rg=document.createElement('div');rg.className='tbr';rg.textContent=ev.s+'–'+ev.e;
    hd.appendChild(lb);if(note){var dot=document.createElement('div');dot.className='ndot';hd.appendChild(dot);}hd.appendChild(rg);
    ca.appendChild(hd);
    if(note){var ne=document.createElement('div');ne.className='tbn';ne.innerHTML=esc(note);ca.appendChild(ne);}
    else{var ah=document.createElement('div');ah.className='tba';ah.textContent='toque para adicionar nota';ca.appendChild(ah);}
    bl.appendChild(te);bl.appendChild(ca);tl.appendChild(bl);
  });
  // custom notes
  Object.keys(notes).forEach(function(k){
    if(k.indexOf(dky+'_')===0&&k.slice(-7)==='_custom'){
      var tp=k.replace(dky+'_','').replace('_custom','');
      var bl2=document.createElement('div');bl2.className='tb';
      var te2=document.createElement('div');te2.className='tbt';te2.textContent=tp;
      var ca2=document.createElement('div');ca2.className='tbc cus';
      ca2.setAttribute('data-key',k);ca2.setAttribute('data-label','Nota · '+tp);ca2.setAttribute('data-time',tp);
      ca2.onclick=function(){openNote(this,false);};
      ca2.innerHTML='<div class="tbh"><div class="tbl">Nota pessoal</div><div class="tbr">'+tp+'</div></div><div class="tbn">'+esc(notes[k])+'</div>';
      bl2.appendChild(te2);bl2.appendChild(ca2);tl.appendChild(bl2);
    }
  });
}

// ── MODAL ────────────────────────────────────────────────────────
// openNote: open existing event block to edit/delete
function openNote(el, showPicker){
  mKey=el.getAttribute('data-key');
  document.getElementById('mtit').textContent=el.getAttribute('data-label');
  document.getElementById('msub').textContent=el.getAttribute('data-time');
  document.getElementById('mnote').value=notes[mKey]||'';
  document.getElementById('tpicker').style.display='none';
  document.getElementById('notelbl').style.display='block';
  document.getElementById('bdel').style.display=notes[mKey]?'flex':'none';
  document.getElementById('modal').classList.add('on');
  setTimeout(function(){document.getElementById('mnote').focus();},100);
}

// openAdd: open new custom note with time picker
// dateKey: pre-selected date key, subtitle: display string
function openAdd(dateKey, subtitle){
  mKey=null; selT=null;
  var isMobile=!dateKey;
  var d=isMobile?curDay:null;
  var dky=isMobile?dk(d):dateKey;
  var sub=isMobile?(DN[d.getDay()]+', '+d.getDate()+' de '+MN[d.getMonth()]):subtitle;
  // store date for save
  document.getElementById('modal').setAttribute('data-dky',dky);
  document.getElementById('mtit').textContent='Nova nota';
  document.getElementById('msub').textContent=sub;
  document.getElementById('mnote').value='';
  document.getElementById('notelbl').style.display='block';
  document.getElementById('bdel').style.display='none';
  // build time chips
  var tpicker=document.getElementById('tpicker');
  tpicker.style.display='block';
  var tg=document.getElementById('tgrid');tg.innerHTML='';
  var times=[];for(var h=5;h<23;h++){times.push(p2(h)+':00');times.push(p2(h)+':30');}
  times.forEach(function(t){
    var ch=document.createElement('div');ch.className='tch';ch.textContent=t;
    ch.onclick=function(){
      document.querySelectorAll('.tch').forEach(function(c){c.classList.remove('sl');});
      ch.classList.add('sl');selT=t;
    };
    tg.appendChild(ch);
  });
  document.getElementById('modal').classList.add('on');
  setTimeout(function(){document.getElementById('mnote').focus();},100);
}

function closeModal(){document.getElementById('modal').classList.remove('on');mKey=null;selT=null;}

function doSave(){
  var v=document.getElementById('mnote').value.trim();
  if(!v){closeModal();return;}
  if(mKey){
    // editing existing
    notes[mKey]=v;
  }else{
    // new custom note
    if(!selT){alert('Selecione um horário.');return;}
    var dky=document.getElementById('modal').getAttribute('data-dky');
    mKey=dky+'_'+selT+'_custom';
    notes[mKey]=v;
  }
  save();closeModal();rAll();
}

function doDelete(){
  if(!mKey)return;
  delete notes[mKey];
  save();closeModal();rAll();
}

function save(){try{localStorage.setItem('g26',JSON.stringify(notes));}catch(e){}}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

// ── NAV ──────────────────────────────────────────────────────────
function calcOff(){
  var dw=TODAY.getDay(),tm=new Date(TODAY);tm.setDate(TODAY.getDate()-(dw===0?6:dw-1));
  var cdw=curDay.getDay(),cm=new Date(curDay);cm.setDate(curDay.getDate()-(cdw===0?6:cdw-1));
  return Math.round((cm-tm)/(7*86400000));
}
function chDay(dir){curDay.setDate(curDay.getDate()+dir);wkOff=calcOff();rAll();}
function chWk(dir){
  wkOff+=dir;
  var dates=gwd(wkOff);
  curDay=new Date(dates[dom(curDay)]);
  rAll();
}
function goToday(){curDay=new Date(TODAY);wkOff=0;rAll();}

// swipe
var tx=0;
document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){
  if(document.getElementById('modal').classList.contains('on'))return;
  if(Math.abs(e.changedTouches[0].clientX-tx)>60)chDay(e.changedTouches[0].clientX<tx?1:-1);
},{passive:true});

function rAll(){rDesk();rMob();}
rAll();
</script>
