<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Calendário 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ede9e2;
  --surface:#fff;
  --s2:#e4e0d8;
  --border:#c8c0b4;
  --text:#1a1714;
  --muted:#7a7268;
  --dim:#b8b0a4;

–c-esporte:#1a6fa8;
–c-trabalho:#a06010;
–c-estudo:#6030b0;
–c-idioma:#a02060;
–c-hobby:#1a7840;
–c-outro:#555050;

–bg-esporte:rgba(26,111,168,.13);
–bg-trabalho:rgba(160,96,16,.11);
–bg-estudo:rgba(96,48,176,.11);
–bg-idioma:rgba(160,32,96,.11);
–bg-hobby:rgba(26,120,64,.11);
–bg-outro:rgba(80,72,68,.1);

–rh:28px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:var(–bg);color:var(–text);font-family:‘DM Sans’,sans-serif;font-size:13px;}

/* ─── HEADER ─── */
.hdr{position:sticky;top:0;z-index:100;background:var(–bg);border-bottom:2px solid var(–border);padding:12px 22px 10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.hdr-l .lbl{font-family:‘DM Mono’,monospace;font-size:9px;letter-spacing:.2em;color:#8a6020;text-transform:uppercase;margin-bottom:3px;}
.hdr-l h1{font-family:‘Playfair Display’,serif;font-size:clamp(16px,2.4vw,24px);font-weight:900;letter-spacing:-.02em;color:var(–text);}
.hdr-r{display:flex;align-items:center;gap:6px;}
.nbtn{background:var(–surface);border:1.5px solid var(–border);color:var(–muted);width:32px;height:32px;border-radius:6px;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;font-weight:600;}
.nbtn:hover{border-color:#8a6020;color:#8a6020;background:#f5eed8;}
.rlbl{font-family:‘DM Mono’,monospace;font-size:10px;color:var(–muted);min-width:110px;text-align:center;letter-spacing:.03em;}
.tbtn{padding:6px 12px;font-family:‘DM Mono’,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;background:var(–surface);border:1.5px solid var(–border);border-radius:6px;color:var(–muted);cursor:pointer;transition:all .15s;}
.tbtn:hover{border-color:#8a6020;color:#8a6020;}

/* ─── LEGEND ─── */
.lbar{display:flex;flex-wrap:wrap;gap:8px;padding:7px 22px;border-bottom:1px solid var(–border);background:var(–surface);}
.leg{display:flex;align-items:center;gap:5px;font-family:‘DM Mono’,monospace;font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(–muted);}
.ldot{width:9px;height:9px;border-radius:2px;}

/* ─── RESPONSIVE ─── */
.dv{display:none;}.mv{display:block;}
@media(min-width:768px){.dv{display:block;}.mv{display:none;}}

/* ─── DESKTOP GRID ─── */
.cw{padding:14px 22px 60px;overflow-x:auto;}
.cg{
display:grid;
grid-template-columns:54px repeat(7,1fr);
border:2px solid var(–border);border-radius:8px;overflow:hidden;
background:var(–border);gap:1px;min-width:740px;
}
.the{background:var(–s2);}
.dhdr{background:var(–s2);padding:10px 6px;text-align:center;}
.dhdr.wk{background:#ddd8ce;}
.dhdr.td .dn,.dhdr.td .dd{color:#8a6020;}
.dn{font-family:‘DM Mono’,monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(–muted);margin-bottom:2px;}
.dd{font-family:‘Playfair Display’,serif;font-size:17px;font-weight:700;color:var(–text);line-height:1;}
.tcol{background:var(–s2);}
.ts{display:flex;align-items:flex-start;justify-content:flex-end;padding:3px 6px 0;}
.ts span{font-family:‘DM Mono’,monospace;font-size:8px;color:var(–muted);}
.dcol{position:relative;background:var(–surface);}
.dcol.wk{background:#f7f4ee;}
.hl{position:absolute;left:0;right:0;border-bottom:1px solid var(–border);pointer-events:none;}
.hl.hr{border-color:var(–s2);}
/* desktop event */
.ev{position:absolute;left:2px;right:2px;border-radius:4px;padding:3px 6px;cursor:pointer;overflow:hidden;border-left:3px solid transparent;transition:filter .15s;}
.ev:hover{filter:brightness(.92);}
.evl{font-family:‘DM Mono’,monospace;font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.evt{font-size:8px;opacity:.65;margin-top:1px;}
.evn{font-size:9px;margin-top:2px;font-style:italic;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ev.esporte{background:var(–bg-esporte);border-color:var(–c-esporte);color:var(–c-esporte);}
.ev.trabalho{background:var(–bg-trabalho);border-color:var(–c-trabalho);color:var(–c-trabalho);}
.ev.estudo{background:var(–bg-estudo);border-color:var(–c-estudo);color:var(–c-estudo);}
.ev.idioma{background:var(–bg-idioma);border-color:var(–c-idioma);color:var(–c-idioma);}
.ev.hobby{background:var(–bg-hobby);border-color:var(–c-hobby);color:var(–c-hobby);}
.ev.outro{background:var(–bg-outro);border-color:var(–c-outro);color:var(–c-outro);}
/* add slot hover */
.asl{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s;border-radius:2px;}
.dcol:hover .asl:hover{opacity:1;background:rgba(138,96,32,.08);}
.asl span{font-family:‘DM Mono’,monospace;font-size:8px;color:var(–muted);letter-spacing:.06em;}

/* ─── MOBILE ─── */
.mdnav{padding:12px 18px 6px;display:flex;align-items:center;gap:8px;}
.dnb{background:var(–surface);border:1.5px solid var(–border);color:var(–muted);width:38px;height:38px;border-radius:8px;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:600;}
.dnb:active{border-color:#8a6020;}
.dc{flex:1;text-align:center;}
.dbig{font-family:‘Playfair Display’,serif;font-size:22px;font-weight:900;color:var(–text);}
.dbig.td{color:#8a6020;}
.dsub{font-family:‘DM Mono’,monospace;font-size:9px;color:var(–muted);margin-top:2px;}
.wstrip{display:flex;gap:3px;padding:0 18px 8px;overflow-x:auto;scrollbar-width:none;}
.wstrip::-webkit-scrollbar{display:none;}
.wc{flex:1;min-width:34px;padding:6px 3px;border-radius:6px;text-align:center;cursor:pointer;border:1.5px solid transparent;}
.wc.act{background:#f5eed8;border-color:#8a6020;}
.wc.itd .wn::after{content:’’;display:block;width:4px;height:4px;background:#8a6020;border-radius:50%;margin:2px auto 0;}
.wdn{font-family:‘DM Mono’,monospace;font-size:8px;text-transform:uppercase;color:var(–muted);}
.wn{font-family:‘Playfair Display’,serif;font-size:14px;font-weight:700;color:var(–muted);}
.wc.act .wdn,.wc.act .wn{color:var(–text);}
.wc.act .wn{color:#8a6020;}
.tl{padding:4px 18px 100px;}
.tb{display:flex;gap:10px;margin-bottom:5px;}
.tbt{width:42px;flex-shrink:0;font-family:‘DM Mono’,monospace;font-size:10px;color:var(–muted);padding-top:11px;text-align:right;}
.tbc{flex:1;border-radius:10px;padding:10px 13px;border-left:3px solid transparent;cursor:pointer;transition:filter .15s;}
.tbc:active{filter:brightness(.93);}
.tbc.esporte{background:var(–bg-esporte);border-color:var(–c-esporte);}
.tbc.trabalho{background:var(–bg-trabalho);border-color:var(–c-trabalho);}
.tbc.estudo{background:var(–bg-estudo);border-color:var(–c-estudo);}
.tbc.idioma{background:var(–bg-idioma);border-color:var(–c-idioma);}
.tbc.hobby{background:var(–bg-hobby);border-color:var(–c-hobby);}
.tbc.outro{background:var(–bg-outro);border-color:var(–c-outro);}
.tbh{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.tbl{font-family:‘DM Mono’,monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;}
.esporte .tbl{color:var(–c-esporte);}.trabalho .tbl{color:var(–c-trabalho);}
.estudo .tbl{color:var(–c-estudo);}.idioma .tbl{color:var(–c-idioma);}
.hobby .tbl{color:var(–c-hobby);}.outro .tbl{color:var(–c-outro);}
.tbr{font-size:10px;color:var(–muted);}
.tbn{font-size:12px;margin-top:4px;font-style:italic;line-height:1.4;color:var(–text);}
.fab{position:fixed;bottom:26px;right:18px;width:52px;height:52px;border-radius:50%;background:#8a6020;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 20px rgba(138,96,32,.4);border:none;z-index:50;}
.fab:active{transform:scale(.92);}

/* ─── MODAL ─── */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center;}
.ov.on{display:flex;}
@media(min-width:768px){
.ov{align-items:center;padding:24px;}
.mo{border-radius:12px!important;max-height:88vh;}
}
.mo{
background:var(–surface);border:1.5px solid var(–border);border-top:3px solid #8a6020;
border-radius:16px 16px 0 0;width:100%;max-width:500px;
display:flex;flex-direction:column;max-height:94vh;
}
.mo-body{padding:18px 20px 0;overflow-y:auto;flex:1;}
.mo-foot{padding:10px 20px 28px;border-top:1px solid var(–border);background:var(–surface);}
@media(min-width:768px){.mo-foot{padding:10px 20px 14px;}}
.moh{width:36px;height:4px;background:var(–dim);border-radius:2px;margin:0 auto 14px;}
.mot{font-family:‘Playfair Display’,serif;font-size:18px;color:var(–text);margin-bottom:2px;}
.mos{font-family:‘DM Mono’,monospace;font-size:9px;letter-spacing:.12em;color:var(–muted);text-transform:uppercase;margin-bottom:16px;}

/* Form fields */
.flbl{font-family:‘DM Mono’,monospace;font-size:9px;letter-spacing:.12em;color:var(–muted);text-transform:uppercase;margin-bottom:6px;margin-top:14px;display:block;}
.flbl:first-of-type{margin-top:0;}

/* Time picker row */
.trow{display:flex;gap:8px;align-items:center;margin-bottom:0;}
.tsel{flex:1;background:var(–s2);border:1.5px solid var(–border);border-radius:8px;color:var(–text);font-family:‘DM Mono’,monospace;font-size:12px;padding:9px 10px;outline:none;cursor:pointer;appearance:none;-webkit-appearance:none;}
.tsel:focus{border-color:#8a6020;}
.tsep{font-family:‘DM Mono’,monospace;font-size:14px;color:var(–muted);}

/* Category pills */
.catrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:0;}
.cpill{font-family:‘DM Mono’,monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:20px;cursor:pointer;border:1.5px solid transparent;transition:all .15s;font-weight:500;}
.cpill:hover{filter:brightness(.92);}
.cpill.esporte{background:var(–bg-esporte);border-color:var(–c-esporte);color:var(–c-esporte);}
.cpill.trabalho{background:var(–bg-trabalho);border-color:var(–c-trabalho);color:var(–c-trabalho);}
.cpill.estudo{background:var(–bg-estudo);border-color:var(–c-estudo);color:var(–c-estudo);}
.cpill.idioma{background:var(–bg-idioma);border-color:var(–c-idioma);color:var(–c-idioma);}
.cpill.hobby{background:var(–bg-hobby);border-color:var(–c-hobby);color:var(–c-hobby);}
.cpill.outro{background:var(–bg-outro);border-color:var(–c-outro);color:var(–c-outro);}
.cpill.sel{filter:brightness(.85);box-shadow:0 0 0 2px currentColor;}

/* Suggestion chips */
.sugrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;min-height:24px;}
.sug{font-family:‘DM Sans’,sans-serif;font-size:11px;padding:4px 10px;border-radius:12px;cursor:pointer;border:1px solid var(–border);background:var(–s2);color:var(–muted);transition:all .15s;}
.sug:hover{border-color:#8a6020;color:#8a6020;}

/* Title input */
.tinp{width:100%;background:var(–s2);border:1.5px solid var(–border);border-radius:8px;color:var(–text);font-family:‘DM Sans’,sans-serif;font-size:14px;padding:9px 12px;outline:none;margin-bottom:0;}
.tinp:focus{border-color:#8a6020;}
.tinp::placeholder{color:var(–muted);}

/* Buttons */
.mact{display:flex;gap:7px;}
.btn{font-family:‘DM Mono’,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:10px 12px;border-radius:8px;cursor:pointer;border:none;flex:1;text-align:center;transition:all .15s;}
.bsv{background:#8a6020;color:#fff;}
.bsv:hover{opacity:.9;}
.bcn{background:var(–s2);border:1.5px solid var(–border);color:var(–muted);}
.bcn:hover{border-color:#8a6020;color:#8a6020;}
.bdl{background:#fff0f0;border:1.5px solid #e0a0a0;color:#b03030;flex:.7;}
.bdl:hover{background:#ffe0e0;}
</style>

</head>

<script>
var TODAY=new Date(), curDay=new Date(TODAY), wkOff=0;
var editKey=null, editDkey=null;
var events={};
try{events=JSON.parse(localStorage.getItem('cal26')||'{}');}catch(e){}

var DN=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
var DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
var MN=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var DW=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];

var CATS=[
  {id:'esporte', label:'Esporte'},
  {id:'trabalho',label:'Trabalho'},
  {id:'estudo',  label:'Estudos'},
  {id:'idioma',  label:'Idioma'},
  {id:'hobby',   label:'Hobby'},
  {id:'outro',   label:'Outro'}
];

var SUGS={
  esporte: ['Natação','Corrida','Squash','Pilates','Yoga','Academia','Caminhada'],
  trabalho:['Reunião','Deep work','1:1','Sprint review','Apresentação','Email'],
  estudo:  ['USP','Tecnólogo','Cert. Salesforce','Cert. Microsoft','Revisão','Prova'],
  idioma:  ['Espanhol','Inglês corporativo','Alemão','Francês','Mandarim','Duolingo'],
  hobby:   ['Piano','Leitura','Cozinhar','Museu','Cinema','Viagem','Amigos'],
  outro:   []
};

function p2(n){return n<10?'0'+n:''+n;}
function dk(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function isT(d){return d.getDate()===TODAY.getDate()&&d.getMonth()===TODAY.getMonth()&&d.getFullYear()===TODAY.getFullYear();}
function dom(d){var j=d.getDay();return j===0?6:j-1;}

var SLOTS=[];for(var h=5;h<23;h++){SLOTS.push(p2(h)+':00');SLOTS.push(p2(h)+':30');}SLOTS.push('23:00');
function si(t){var x=t.split(':');return(parseInt(x[0])-5)*2+(parseInt(x[1])>=30?1:0);}
var RH=28;

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
function fmt(d){return d.getDate()+'/'+(d.getMonth()+1);}

// ── GET EVENTS FOR A DAY ─────────────────────────────────────────
function getDayEvents(dky){
  return (events[dky]||[]).slice().sort(function(a,b){return si(a.start)-si(b.start);});
}

// ── WEEK DATES ───────────────────────────────────────────────────
function gwd(off){
  var t=new Date(TODAY),dw=t.getDay();
  var m=new Date(t);m.setDate(t.getDate()-(dw===0?6:dw-1)+off*7);
  var o=[];for(var i=0;i<7;i++){var d=new Date(m);d.setDate(m.getDate()+i);o.push(d);}return o;
}

// ── DESKTOP ──────────────────────────────────────────────────────
function rDesk(){
  var dates=gwd(wkOff);
  var mo=dates[0].getMonth();
  document.getElementById('hdrTitle').textContent='Semana de '+fmt(dates[0])+' a '+fmt(dates[6]);
  document.getElementById('rlbl').textContent=fmt(dates[0])+' – '+fmt(dates[6]);

  var grid=document.getElementById('dg');grid.innerHTML='';
  var tot=SLOTS.length;

  // header
  var the=document.createElement('div');the.className='the';grid.appendChild(the);
  for(var d=0;d<7;d++){
    var dh=document.createElement('div');
    dh.className='dhdr'+(isT(dates[d])?' td':'')+(d>=5?' wk':'');
    dh.innerHTML='<div class="dn">'+DW[d]+'</div><div class="dd">'+dates[d].getDate()+'</div>';
    grid.appendChild(dh);
  }

  // time col
  var tc=document.createElement('div');tc.className='tcol';tc.style.height=(tot*RH)+'px';
  SLOTS.forEach(function(t,i){
    var ts=document.createElement('div');ts.className='ts';ts.style.height=RH+'px';
    if(i%2===0)ts.innerHTML='<span>'+t+'</span>';tc.appendChild(ts);
  });
  grid.appendChild(tc);

  // day cols
  for(var d=0;d<7;d++){
    var col=document.createElement('div');col.className='dcol'+(d>=5?' wk':'');col.style.height=(tot*RH)+'px';
    // grid lines
    for(var i=0;i<tot;i++){
      var ln=document.createElement('div');ln.className='hl'+(i%2===0?' hr':'');ln.style.top=(i*RH)+'px';col.appendChild(ln);
    }
    // events
    var devs=getDayEvents(dk(dates[d]));
    var occ=new Array(tot).fill(false);
    devs.forEach(function(ev){
      var s=si(ev.start),e=si(ev.end);if(e<=s)e=s+1;
      for(var i=s;i<e&&i<tot;i++)occ[i]=true;
      var hp=Math.max((e-s)*RH-3,RH-3);
      var el=document.createElement('div');el.className='ev '+(ev.cat||'outro');
      el.style.cssText='top:'+(s*RH+1)+'px;height:'+hp+'px;';
      el.setAttribute('data-dky',dk(dates[d]));el.setAttribute('data-id',ev.id);
      el.onclick=function(){openModal(this.getAttribute('data-dky'),this.getAttribute('data-id'),null);};
      el.innerHTML='<div class="evl">'+esc(ev.title)+'</div>'+(hp>RH?'<div class="evt">'+ev.start+'–'+ev.end+'</div>':'');
      col.appendChild(el);
    });
    // add slot overlays
    for(var i=0;i<tot;i++){
      if(!occ[i]){
        (function(si2,di){
          var sl=document.createElement('div');sl.className='asl';sl.style.cssText='top:'+(si2*RH)+'px;height:'+RH+'px;';
          sl.innerHTML='<span>+ evento</span>';
          sl.onclick=function(e){
            e.stopPropagation();
            openModal(dk(dates[di]),null,SLOTS[si2]);
          };
          col.appendChild(sl);
        })(i,d);
      }
    }
    grid.appendChild(col);
  }
}

// ── MOBILE ───────────────────────────────────────────────────────
function rMob(){
  var d=curDay, dw=dom(d);
  var dn=document.getElementById('dname');dn.textContent=DN[d.getDay()];dn.className='dbig'+(isT(d)?' td':'');
  document.getElementById('dsub').textContent=d.getDate()+' de '+MN[d.getMonth()]+' · '+d.getFullYear();

  var st=document.getElementById('wstrip');st.innerHTML='';
  var m=new Date(d);m.setDate(d.getDate()-dw);
  for(var i=0;i<7;i++){
    var dd=new Date(m);dd.setDate(m.getDate()+i);
    var ch=document.createElement('div');ch.className='wc'+(i===dw?' act':'')+(isT(dd)?' itd':'');
    ch.innerHTML='<div class="wdn">'+DS[dd.getDay()]+'</div><div class="wn">'+dd.getDate()+'</div>';
    (function(date){ch.onclick=function(){curDay=new Date(date);rMob();};})(dd);
    st.appendChild(ch);
  }

  var tl=document.getElementById('tl');tl.innerHTML='';
  var devs=getDayEvents(dk(d));
  if(!devs.length){
    var empty=document.createElement('div');
    empty.style.cssText='text-align:center;padding:48px 20px;color:var(--muted);font-size:13px;';
    empty.innerHTML='Nenhum evento · toque em <strong>+</strong> para adicionar';
    tl.appendChild(empty);return;
  }
  devs.forEach(function(ev){
    var bl=document.createElement('div');bl.className='tb';
    var te=document.createElement('div');te.className='tbt';te.textContent=ev.start;
    var ca=document.createElement('div');ca.className='tbc '+(ev.cat||'outro');
    ca.setAttribute('data-dky',dk(d));ca.setAttribute('data-id',ev.id);
    ca.onclick=function(){openModal(this.getAttribute('data-dky'),this.getAttribute('data-id'),null);};
    ca.innerHTML='<div class="tbh"><div class="tbl">'+esc(ev.title)+'</div><div class="tbr">'+ev.start+'–'+ev.end+'</div></div>';
    bl.appendChild(te);bl.appendChild(ca);tl.appendChild(bl);
  });
}

// ── MODAL ────────────────────────────────────────────────────────
var selCat='outro';

function openModal(dky, evId, preTime){
  // dky: date key, evId: existing event id or null, preTime: pre-selected start time or null
  editKey=evId;
  editDkey=dky||dk(curDay);

  var existing=null;
  if(evId&&events[editDkey]){
    existing=(events[editDkey]||[]).find(function(e){return e.id===evId;});
  }

  // title
  document.getElementById('mtit').textContent=existing?'Editar evento':'Novo evento';
  // sub
  var d=dky?new Date(dky.replace(/-/g,'/')):curDay;
  document.getElementById('msub').textContent=DN[d.getDay()]+', '+d.getDate()+' de '+MN[d.getMonth()];

  // category pills
  selCat=existing?existing.cat:'outro';
  buildCatRow();

  // suggestions
  buildSugs(selCat);

  // title input
  document.getElementById('tinp').value=existing?existing.title:'';

  // time selects
  buildTimeSelects(existing?existing.start:(preTime||'08:00'), existing?existing.end:(preTime?nextSlot(preTime):'09:00'));

  // delete button
  document.getElementById('bdel').style.display=existing?'flex':'none';

  document.getElementById('modal').classList.add('on');
  setTimeout(function(){document.getElementById('tinp').focus();},120);
}

function nextSlot(t){
  var idx=SLOTS.indexOf(t);
  return idx>=0&&idx<SLOTS.length-1?SLOTS[idx+1]:t;
}

function buildCatRow(){
  var row=document.getElementById('catrow');row.innerHTML='';
  CATS.forEach(function(c){
    var p=document.createElement('div');p.className='cpill '+c.id+(selCat===c.id?' sel':'');
    p.textContent=c.label;
    p.onclick=function(){
      selCat=c.id;
      document.querySelectorAll('.cpill').forEach(function(x){x.classList.remove('sel');});
      p.classList.add('sel');
      buildSugs(c.id);
    };
    row.appendChild(p);
  });
}

function buildSugs(cat){
  var row=document.getElementById('sugrow');row.innerHTML='';
  (SUGS[cat]||[]).forEach(function(s){
    var ch=document.createElement('div');ch.className='sug';ch.textContent=s;
    ch.onclick=function(){document.getElementById('tinp').value=s;};
    row.appendChild(ch);
  });
}

function buildTimeSelects(start,end){
  var ss=document.getElementById('tstart'),se=document.getElementById('tend');
  ss.innerHTML='';se.innerHTML='';
  SLOTS.forEach(function(t){
    var o1=document.createElement('option');o1.value=t;o1.textContent=t;if(t===start)o1.selected=true;ss.appendChild(o1);
    var o2=document.createElement('option');o2.value=t;o2.textContent=t;if(t===end)o2.selected=true;se.appendChild(o2);
  });
}

function closeModal(){document.getElementById('modal').classList.remove('on');editKey=null;editDkey=null;}

function doSave(){
  var title=document.getElementById('tinp').value.trim();
  if(!title){document.getElementById('tinp').focus();return;}
  var start=document.getElementById('tstart').value;
  var end=document.getElementById('tend').value;
  if(si(end)<=si(start)){
    var idx=SLOTS.indexOf(start);
    end=idx<SLOTS.length-1?SLOTS[idx+1]:start;
  }
  if(!events[editDkey])events[editDkey]=[];
  if(editKey){
    // edit existing
    events[editDkey]=events[editDkey].map(function(e){
      return e.id===editKey?{id:editKey,title:title,cat:selCat,start:start,end:end}:e;
    });
  }else{
    // new
    var id='e'+Date.now();
    events[editDkey].push({id:id,title:title,cat:selCat,start:start,end:end});
  }
  persist();closeModal();rAll();
}

function doDelete(){
  if(!editKey||!editDkey)return;
  events[editDkey]=(events[editDkey]||[]).filter(function(e){return e.id!==editKey;});
  persist();closeModal();rAll();
}

function persist(){try{localStorage.setItem('cal26',JSON.stringify(events));}catch(e){}}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

// ── NAV ──────────────────────────────────────────────────────────
function calcOff(){
  var dw=TODAY.getDay(),tm=new Date(TODAY);tm.setDate(TODAY.getDate()-(dw===0?6:dw-1));
  var cdw=curDay.getDay(),cm=new Date(curDay);cm.setDate(curDay.getDate()-(cdw===0?6:cdw-1));
  return Math.round((cm-tm)/(7*86400000));
}
function chDay(dir){curDay.setDate(curDay.getDate()+dir);wkOff=calcOff();rAll();}
function chWk(dir){
  wkOff+=dir;var dates=gwd(wkOff);
  curDay=new Date(dates[dom(curDay)]);
  rAll();
}
function goToday(){curDay=new Date(TODAY);wkOff=0;rAll();}

var tx=0;
document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){
  if(document.getElementById('modal').classList.contains('on'))return;
  if(Math.abs(e.changedTouches[0].clientX-tx)>60)chDay(e.changedTouches[0].clientX<tx?1:-1);
},{passive:true});

function rAll(){rDesk();rMob();}
rAll();
</script>
